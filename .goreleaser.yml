# all available options: https://goreleaser.com/customization/
project_name: summon-aws-secrets

before:
  hooks: []

builds:
  - id: summon-aws-secrets
    binary: summon-aws-secrets
    env:
      - CGO_ENABLED=0
    goos:
      - 'darwin'       # MacOS
      - 'freebsd'
      - 'linux'
      - 'netbsd'
      - 'openbsd'
      - 'solaris'
      - 'windows'
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X "github.com/cyberark/summon/pkg/summon.Tag={{ .ShortCommit }}"
      - -X "github.com/cyberark/summon/pkg/summon.Version={{ .Env.VERSION }}"
    hooks:
      post:
        # Copy the binary out into the <dist> path, and give the copy the name we want
        # in the release <extra_files>.
        # e.g. Suppose a windows amd64 build generates a binary at
        # path/to/binary.exe. This will be copied to
        # path/to/../binary-windows_amd64.exe. The copy path can then be added to
        # the release <extra_files> and will result in a release artifact with the name
        # binary-windows_amd64.exe.
        - mkdir -p "{{ dir .Path }}/../binaries"
        - cp "{{ .Path }}" "{{ dir .Path }}/../binaries/summon_{{ .Target }}{{ .Ext }}"
  
  - id: summon-aws-secrets-arm
    binary: summon-aws-secrets
    env:
      - CGO_ENABLED=0
    goos:
      - 'darwin'       # MacOS
    goarch:
      - arm64
    ldflags:
    - -s -w
    - -X "github.com/cyberark/summon/pkg/summon.Tag={{ .ShortCommit }}"
    - -X "github.com/cyberark/summon/pkg/summon.Version={{ .Env.VERSION }}"
    hooks:
      post:
        # Copy the binary out into the <dist> path, and give the copy the name we want
        # in the release <extra_files>.
        # e.g. Suppose a windows amd64 build generates a binary at
        # path/to/binary.exe. This will be copied to
        # path/to/../binary-windows_amd64.exe. The copy path can then be added to
        # the release <extra_files> and will result in a release artifact with the name
        # binary-windows_amd64.exe.
        - mkdir -p "{{ dir .Path }}/../binaries"
        - cp "{{ .Path }}" "{{ dir .Path }}/../binaries/summon_{{ .Target }}{{ .Ext }}"


archives:
  - id: summon-aws-secrets
    name_template: "{{.ProjectName}}-{{.Os}}-{{.Arch}}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - CHANGELOG.md
      - README.md
      - LICENSE
      - SECURITY.md

brews:
  - description: AWS Secrets Manager provider for Summon
    homepage: https://github.com/cyberark/summon-aws-secrets
    url_template: https://github.com/cyberark/summon-aws-secrets/releases/download/v{{.Version}}/summon-aws-secrets-{{ tolower .Os }}-{{ tolower .Arch }}.tar.gz
    install: |
      target = lib/"summon"
      target.install "summon-aws-secrets"
    test: |
      system lib/"summon"/"summon-aws-secrets", "-v"

    repository:
      owner: cyberark
      name: homebrew-tools
    skip_upload: true

checksum:
  name_template: 'SHA256SUMS.txt'

dist: ./dist/goreleaser

nfpms:
  - file_name_template: "{{ .ProjectName }}"
    vendor: CyberArk
    homepage: https://github.com/cyberark/summon-aws-secrets
    maintainer: Conjur Maintainers <conj_maintainers@cyberark.com>

    description: Summon provider for AWS Secrets
    recommends:
      - summon
    license: MIT
    formats:
    - deb
    - rpm
    bindir: /usr/local/lib/summon  # where the binary is placed, default summon provider dir

release:
  disable: true
